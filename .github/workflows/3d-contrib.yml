name: 🏙️ 3D Contribution Skyline

on:
  schedule:
    - cron: "0 18 * * *"   # Every day at 6 PM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Generate 3D SVG ───────────────────────────────────────────
      - name: Generate 3D Skyline SVG
        uses: yoshi-code-bot/gh-action-skyline-svg@main
        with:
          GITHUB_USER_NAME: harshu078600-tech
          SETTING_JSON: >
            {
              "type":           "normal",
              "title":          "harshu078600-tech",
              "topHeader":      "Contributions",
              "backgroundColor":"#0d1117",
              "foregroundColor":"#00d9ff",
              "barColor":       "#7c83fd",
              "barBgColor":     "#1a1a2e",
              "textColor":      "#c9d1d9",
              "dayDotBgColor":  "#1a1a2e"
            }

      # ── Push SVG to main branch ───────────────────────────────────
      - name: Deploy to main branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: main
          build_dir: ./profile-3d-contrib
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
